variables:
  BUILD_DIR: build
  R_PROFILE_USER: "$CI_PROJECT_DIR/ci_scripts/Rprofile.ci"
  # define the development and production version of R
  R_DEV: "4.5.1"
  R_PROD: "4.5.1"

stages:
    - build
    - test
    - test_with_cpblib

before_script:
    - Rscript_$R_DEV -e "cat('library-paths:\n');print(.libPaths())"

build-job:
  stage: build
  variables:
    USE_CPBLIB: "false"
  script:
    # The package is build and tested using a the local packages of gitlab-runner.
    - Rscript_$R_DEV ci_scripts/prepare_local_lib.R
    - R_$R_DEV CMD build pkg 
    - mkdir $BUILD_DIR
    - mv *.tar.gz $BUILD_DIR
    # Install the package in the local library
    - R_$R_DEV CMD INSTALL $BUILD_DIR/*.tar.gz
  artifacts:
    paths:
      - build

Check package:
  stage: test
  variables:
    USE_CPBLIB: "false"
  script:
    #- R_$R_DEV CMD check $BUILD_DIR/*.tar.gz
    - echo "aap"

Lint package:
  stage: test
  variables:
    USE_CPBLIB: "false"
  script:
    #- Rscript ci_scripts/lint_pkg.R
    - echo "aap"

Test package in cpblib:
  stage: test_with_cpblib
  variables:
    UMFPACKR_LIB: $CI_PROJECT_DIR/umfpackrlib 
  before_script:
  script:

    # Step 1: install umfpackr in directory umfpackrlib.

    # First make sure that all required packages are need for this R-version,
    # this is required if R_PROD != R_DEV.
    - USE_CPBLIB=false Rscript_$R_PROD ci_scripts/prepare_local_lib.R
    - mkdir -p $UMFPACKR_LIB
    - USE_CPBLIB=false R_$R_PROD CMD INSTALL --preclean --clean -l "$UMFPACKR_LIB" $BUILD_DIR/*.tar.gz
    - ls -l $R_LIBS_USER

    # Now use cpblib to test regts
    - export R_LIBS_USER=$UMFPACKR_LIB
    - USE_CPLIB=true Rscript_$R_PROD -e 'print(list.files(Sys.getenv("R_LIBS_USER")))'
    - USE_CPLIB=true Rscript_$R_PROD -e 'pkgs <- dir(Sys.getenv("R_LIBS_USER")); print(pkgs); if (!identical(pkgs, "umfpackr")) stop("Expected only umfpackr")'
    - USE_CPBLIB=true Rscript_$R_PROD -e "cat('library-paths:\n');print(.libPaths())"
    - USE_CPBLIB=true Rscript_$R_PROD -e "testthat::test_package('umfpackr', stop_on_failure = TRUE)"

  rules:
    # Sometimes this check should be skipped (when Mimosigereedschap
    # needs versions of packages not in cpblib)
    - if: '$test_within_cpblib == "skip"'
      when: never
    - when: on_success

